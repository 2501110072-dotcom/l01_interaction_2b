        }

            console.log(`${1}번째 할 일: ${todos[i]}`);
        }

        for (const todo of todos) {

        }

        // for 반복문
        for (let i = 0; i < todos.length; i++) {
            console.log(`${i}번째 반복입니다`);
        }

        let output = 0;
        for (let i = 1; i <=100; i++) {
            output += i;
            
        }
        console.log(`1~100까지 숫자를 모두 더하면 ${output}입니다`);

        for (let i = 0; i<todos.length; i++) {
            console.log(`오늘의 할 일: ${todos[i]}`);
        }

            console.log(`오늘의 할 일: ${todos[i]}`);
        }

        //1부터 30까지 짝수의 합

        let output2 = 0
        for (let i = 1; i <= 10; i++) {

        //중첩반복문

                output3 += '*';
            }

        }

            }

        }
