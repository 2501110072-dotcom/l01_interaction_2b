<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Interactive Shape Motion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    overflow:hidden;
    background:#050505;
    height:100vh;
    cursor:none;
    font-family:sans-serif;
}

/* 정보 패널 */
.info{
    position:fixed;
    top:20px;
    left:20px;
    color:white;
    z-index:9999;
    font-size:18px;
    line-height:1.7;
}

/* 공통 도형 */
.shape{
    position:absolute;
    pointer-events:none;

    animation: float 2s linear forwards;

    mix-blend-mode:screen;
}

/* 애니메이션 */
@keyframes float{

    0%{
        opacity:1;
        transform:
        translate(-50%,-50%)
        scale(0.3)
        rotate(0deg);
    }

    100%{
        opacity:0;
        transform:
        translate(-50%,-250%)
        scale(2)
        rotate(720deg);
    }
}

.center{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    font-size:120px;
    color:#111;
    font-weight:900;
    letter-spacing:10px;
}

</style>
</head>
<body>

<div class="info">
    <div>X : <span id="mx">0</span></div>
    <div>Y : <span id="my">0</span></div>
    <div>Shapes : <span id="count">0</span></div>
    <div>Mode : <span id="mode">Random</span></div>
</div>

<div class="center">SHAPE</div>

<script>

// 총 생성 개수
let total = 0;

// 도형 종류
const shapes = [
    "circle",
    "square",
    "triangle",
    "line"
];

// 랜덤 숫자 함수
function random(min,max){

    return Math.random() * (max-min) + min;

}

// 랜덤 컬러 함수
function randomColor(){

    const r = Math.floor(Math.random()*255);
    const g = Math.floor(Math.random()*255);
    const b = Math.floor(Math.random()*255);

    return `rgb(${r},${g},${b})`;

}

// 랜덤 도형 함수
function randomShape(){

    return shapes[
        Math.floor(Math.random()*shapes.length)
    ];

}

// 도형 생성 함수
function createShape(x,y){

    const shape = document.createElement("div");

    shape.classList.add("shape");

    const type = randomShape();

    const size = random(20,150);

    const color = randomColor();

    // 원
    if(type === "circle"){

        shape.style.width = `${size}px`;
        shape.style.height = `${size}px`;

        shape.style.borderRadius = "50%";

        shape.style.background = color;

    }

    // 사각형
    else if(type === "square"){

        shape.style.width = `${size}px`;
        shape.style.height = `${size}px`;

        shape.style.background = color;

    }

    // 삼각형
    else if(type === "triangle"){

        shape.style.width = "0";
        shape.style.height = "0";

        shape.style.borderLeft =
        `${size/2}px solid transparent`;

        shape.style.borderRight =
        `${size/2}px solid transparent`;

        shape.style.borderBottom =
        `${size}px solid ${color}`;

    }

    // 선
    else if(type === "line"){

        shape.style.width = `${size*2}px`;
        shape.style.height = `4px`;

        shape.style.background = color;

    }

    // 위치
    shape.style.left = `${x}px`;
    shape.style.top = `${y}px`;

    // 블러
    shape.style.filter =
    `blur(${random(0,5)}px)`;

    // 회전
    shape.style.transform =
    `translate(-50%,-50%)
    rotate(${random(0,360)}deg)`;

    document.body.appendChild(shape);

    total++;

    document.getElementById("count").innerText = total;

    // 제거
    setTimeout(()=>{
        shape.remove();
    },2000);

}

// 마우스 움직임
document.addEventListener("mousemove", function(event){

    createShape(
        event.clientX,
        event.clientY
    );

    document.getElementById("mx").innerText =
    event.clientX;

    document.getElementById("my").innerText =
    event.clientY;

});

// 클릭 시 폭발
document.addEventListener("click", function(event){

    for(let i=0; i<60; i++){

        setTimeout(()=>{

            createShape(

                event.clientX + random(-200,200),

                event.clientY + random(-200,200)

            );

        },i*10);

    }

});

</script>
</body>
</html>
