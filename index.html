<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Creative Sequential Motion</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#111;
    overflow:hidden;
    font-family:'Pretendard', sans-serif;
}

/* VISUAL */
.visual{
    width:100%;
    height:100vh;
    background:
    linear-gradient(to bottom, rgba(0,0,0,.2), rgba(0,0,0,.6)),
    url("imgs/visual_bg.jpg") center/cover no-repeat;
    position:relative;
}

.visual .inner{
    width:1200px;
    height:100%;
    margin:0 auto;
    position:relative;
}

/* 공통 */
.motion{
    opacity:0;
    transform:translateY(100px) scale(.8);
    transition:
    opacity 1s ease,
    transform 1s ease;
}

.motion.show{
    opacity:1;
    transform:translateY(0) scale(1);
}

/* TITLE */
.title{
    position:absolute;
    top:120px;
    left:0;
}

.title img{
    width:500px;
}

/* CUP1 */
.pcup1{
    position:absolute;
    bottom:-30px;
    right:20px;
}

.cup1.image{
    width:320px;
    filter:drop-shadow(0 30px 40px rgba(0,0,0,.35));
}

.cup1.text{
    position:absolute;
    top:-40px;
    left:-140px;
    width:180px;
}

/* CUP2 */
.pcup2{
    position:absolute;
    bottom:-10px;
    right:320px;
}

.cup2.image{
    width:250px;
    filter:drop-shadow(0 25px 35px rgba(0,0,0,.35));
}

.cup2.text{
    position:absolute;
    top:140px;
    right:180px;
    width:160px;
}

/* SPOON */
.pspoon{
    position:absolute;
    bottom:-20px;
    left:260px;
}

.pspoon img{
    width:250px;
}

/* 배경 원 */
.circle{
    position:absolute;
    border-radius:50%;
    background:rgba(255,255,255,.06);
    
    opacity:0;
    transform:scale(0);
    transition:1s ease;
}

.circle.show{
    opacity:1;
    transform:scale(1);
}

.circle1{
    width:400px;
    height:400px;
    top:80px;
    right:120px;
}

.circle2{
    width:220px;
    height:220px;
    bottom:120px;
    left:150px;
}

/* FLOAT */
.float{
    animation:floating 3s ease-in-out infinite;
}

@keyframes floating{

    0%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-18px);
    }

    100%{
        transform:translateY(0);
    }

}

/* TEXT EFFECT */
.caption{
    position:absolute;
    left:0;
    bottom:120px;
    color:white;
    opacity:0;
    transform:translateY(40px);
    transition:1s ease;
}

.caption.show{
    opacity:1;
    transform:translateY(0);
}

.caption h1{
    font-size:70px;
    line-height:1.1;
    margin-bottom:20px;
}

.caption p{
    font-size:18px;
    color:#d8d8d8;
    line-height:1.8;
}

</style>
</head>

<body>

<section class="visual">

    <div class="inner">

        <!-- 배경 원 -->
        <div class="circle circle1"></div>
        <div class="circle circle2"></div>

        <!-- 타이틀 -->
        <div class="title motion">
            <img src="imgs/visual_title.png" alt="">
        </div>

        <!-- 설명 -->
        <div class="caption">
            <h1>
                SWEET<br>
                CREAM LATTE
            </h1>

            <p>
                부드러운 등장 애니메이션과<br>
                순차적 인터랙션이 결합된<br>
                비주얼 메인 섹션
            </p>
        </div>

        <!-- 컵1 -->
        <div class="pcup1 motion float">
            <img src="imgs/visual_cup1.png" alt="" class="cup1 image">
            <img src="imgs/visual_cup1_text.png" alt="" class="cup1 text">
        </div>

        <!-- 컵2 -->
        <div class="pcup2 motion float">
            <img src="imgs/visual_cup2.png" alt="" class="cup2 image">
            <img src="imgs/visual_cup2_text.png" alt="" class="cup2 text">
        </div>

        <!-- 스푼 -->
        <div class="pspoon motion float">
            <img src="imgs/visual_spoon.png" alt="">
        </div>

    </div>

</section>

<script>

/* 순차 등장 */

const motions = document.querySelectorAll('.motion');

motions.forEach((item, index) => {

    setTimeout(() => {
        item.classList.add('show');
    }, index * 700);

});

/* 원 등장 */

setTimeout(() => {
    document.querySelector('.circle1').classList.add('show');
}, 300);

setTimeout(() => {
    document.querySelector('.circle2').classList.add('show');
}, 900);

/* 텍스트 등장 */

setTimeout(() => {
    document.querySelector('.caption').classList.add('show');
}, 1500);

</script>

</body>
</html>
