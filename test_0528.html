<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/ScrollMagic/2.0.8/ScrollMagic.min.js" integrity="sha512-8E3KZoPoZCD+1dgfqhPbejQBnQfBXe8FuwL4z/c8sTrgeDMFEnoyTlH3obB4/fV+6Sg0a0XF+L/6xS4Xx1fUEg==" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    <style>
        body {
            margin: 0;
        }
        section {
            width: 100%;
        }
        .container {
            position: relative;
            width: 1200px;
            height: 600px;
            padding: 200px
            margin: 0 auto;
            background-color: skyblue;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .section:nth-child(even){
            background-color: lightgray;
        }
        h1 {
            position: absolute;
            top: 0;
            color: white;
            font-size: 100px;
            margin: 0;
        }
        .box {
            width: 100px;
            height: 100px;
            margin: 10px
            background-color: lightyellow;
        }
        .back-to-position {
            opacity: 0;
        }
        .show .back-to-position {
            opacity: 1;
        }

    </style>
</head>
<body>
    <div class="section scroll-spy">
        <div class="container">
            <h1>Home</h1>
            <div class="box back-to-position to-right"></div>
            <div class="box back-to-position to-left"></div>
        </div>
    </div>
    <div class="section scroll-spy">
        <div class="container">
            <h1>About</h1>
            <div class="box back-to-position to-right"></div>
            <div class="box back-to-position to-left"></div>
        </div>
    </div>
    <div class="section scroll-spy">
        <div class="container">
            <h1>Skills</h1>
            <div class="box back-to-position to-right"></div>
            <div class="box back-to-position to-left"></div>
        </div>
    </div>
    <div class="section scroll-spy">
        <div class="container">
            <h1>Works</h1>
            <div class="box back-to-position to-right"></div>
            <div class="box back-to-position to-left"></div>
        </div>
    </div>
    <div class="section scroll-spy">
        <div class="container">
            <h1>Contact</h1>
            <div class="box back-to-position to-right"></div>
            <div class="box back-to-position to-left"></div>
        </div>
    </div>
</body>
</html>
